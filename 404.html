<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>gastaro</title>
<style>
:root{--bg:#141510;--fg:#F2EEE6;--mut:#9C9B8E;--acc:#D4E157}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px}
main{display:flex;flex-direction:column;gap:18px;align-items:center;max-width:520px}
h1{font-size:44px;margin:0;letter-spacing:-.02em}
p{color:var(--mut);margin:0;line-height:1.6}
a{color:var(--fg)}
.btn{display:inline-block;margin-top:8px;background:var(--acc);color:#141510;text-decoration:none;font-weight:600;border-radius:999px;padding:12px 22px}
</style>
</head>
<body>
<main>
<h1>gastaro</h1>
<p>Hier liegen persönliche Präsentationen für unsere Gastro-Partner. Den Link zu Ihrer Präsentation haben Sie per Mail erhalten.</p>
<a class="btn" href="https://gastaro.de">Zu gastaro.de</a>
</main>
</body>
</html>
